{% extends "base.html" %}

{% block title %}Register - Student Management{% endblock %}

{% block content %}
<div class="header">
    <h1>Create Account</h1>
</div>

<div class="card" style="max-width: 400px; margin: 2rem auto;">
    <form method="POST" style="padding: 2rem;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required class="form-control" placeholder="Min 3 characters">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required class="form-control" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required class="form-control" placeholder="Min 6 characters">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
        
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted);">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); font-weight: 500;">Login here</a>
        </p>
    </form>
</div>
{% endblock %}
