{% extends "base.html" %}

<!-- Set the page title -->
{% block title %}Add Student - Student Management{% endblock %}

{% block content %}
<div class="header">
    <h1>Add New Student</h1>
    <a href="/" class="btn btn-secondary">Back to Dashboard</a>
</div>

<div class="card">
    <!-- Form to collect student data. It sends a POST request to the current URL -->
    <form method="POST" style="padding: 2rem;">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" required class="form-control" placeholder="Enter student's full name">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="text" name="email" required class="form-control" placeholder="example@email.com">
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" required class="form-control" placeholder="20">
        </div>
        <div class="form-group">
            <label>Course</label>
            <input type="text" name="course" required class="form-control" placeholder="e.g. Computer Science">
        </div>
        <!-- Submit button to trigger the POST request -->
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Student Record</button>
    </form>
</div>
{% endblock %}
