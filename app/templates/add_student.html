{% extends "base.html" %}

{% block title %}Add Student - Student Management{% endblock %}

{% block content %}
<div class="header">
    <h1>Add New Student</h1>
    <a href="/" class="btn btn-secondary">Back to List</a>
</div>

<div class="card form-container">
    <form action="/add" method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter student name">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="Enter email address">
        </div>
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" required placeholder="Enter age">
        </div>
        <div class="form-group">
            <label for="course">Course</label>
            <input type="text" id="course" name="course" required placeholder="Enter course name">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Student</button>
        </div>
    </form>
</div>
{% endblock %}
