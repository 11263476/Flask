{% extends "base.html" %}

{% block title %}Edit Student - Student Management{% endblock %}

{% block content %}
<div class="header">
    <h1>Edit Student</h1>
    <a href="/" class="btn btn-secondary">Back to List</a>
</div>

<div class="card form-container">
    <form action="/edit/{{ student.id }}" method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" value="{{ student.name }}" required placeholder="Enter student name">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ student.email }}" required placeholder="Enter email address">
        </div>
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" value="{{ student.age }}" required placeholder="Enter age">
        </div>
        <div class="form-group">
            <label for="course">Course</label>
            <input type="text" id="course" name="course" value="{{ student.course }}" required placeholder="Enter course name">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update Student</button>
        </div>
    </form>
</div>
{% endblock %}
