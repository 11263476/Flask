{% extends "base.html" %}

{% block title %}Edit Student - {{ student.name }}{% endblock %}

{% block content %}
<div class="header">
    <h1>Edit Student Details</h1>
    <a href="/" class="btn btn-secondary">Back to Dashboard</a>
</div>

<div class="card">
    <form method="POST" class="form-card" style="padding: 2rem;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="name" value="{{ student.name }}" required class="form-control">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="text" name="email" value="{{ student.email }}" required class="form-control">
        </div>
        <div class="form-group">
            <label>Age</label>
            <input type="number" name="age" value="{{ student.age }}" required class="form-control">
        </div>
        <div class="form-group">
            <label>Course</label>
            <input type="text" name="course" value="{{ student.course }}" required class="form-control">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Update Student Record</button>
    </form>
</div>
{% endblock %}
